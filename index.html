function tick(){if(S.over)return;if(S.brk>0){S.brk--;send();return}S.tick++;
 S.st.forEach(x=>{let r=(Math.random()-.5)*.045+(x.d||0);if(x.d)x.d*=.8;if(Math.random()<.03)r+=(Math.random()-.5)*.25;x.p=Math.max(1,+(x.p*(1+r)).toFixed(2))});
 if(S.tick>=TICKS){S.snap=[eq(0),eq(1)];if(S.tv){S.log.unshift({w:-1,t:'🕵️ 盤前線索「'+S.tv.s+'」結果：'+(S.tv.real?'✅ 消息屬實':'❌ 假消息，騙到你了吧')})}S.st.forEach(x=>x.o=x.p);if(S.round>=S.R){S.over=true}else{S.round++;S.tick=0;newsCard();S.brk=NEWS_S;if((S.round-1)%2==0){S.pl.forEach(p=>{p.up+=2;p.dn+=2;p.sn=(p.sn||0)+1});S.log.unshift({w:-1,t:'🎁 補給：雙方各獲得 🚀×2、💣×2、🎯×1'});S.log=S.log.slice(0,20)}}}send()}
function eq(i){const p=S.pl[i];return p.cash+S.st.reduce((a,x)=>a+(p.pos[x.s]||0)*x.p,0)}
function act(i,d){if(S.over||S.brk>0)return;const x=S.st.find(t=>t.s==d.s);if(!x)return;const q=d.q|0,p=S.pl[i];
 if(d.sn){if(!(p.sn>0))return;p.sn--;const m=(Math.random()<.5?-1:1)*(.08+Math.random()*.07);x.p=+(x.p*(1+m)).toFixed(2);S.log.unshift({w:-1,t:'🎯 狙擊！'+x.s+' 瞬間'+(m>0?'暴漲 +':'暴跌 ')+(m*100).toFixed(1)+'%'});S.log=S.log.slice(0,20);send();return}
 if(d.pw){const k=d.pw>0?'up':'dn';if(p[k]<=0)return;p[k]--;x.p=+(x.p*(1+d.pw*.06)).toFixed(2);x.d=d.pw*.03;S.log.unshift({w:-1,t:(d.pw>0?'🚀 神秘大戶拉抬 ':'💣 神秘空頭砸盤 ')+x.s+'！'});S.log=S.log.slice(0,20);send();return}
 if(q>0&&p.cash<q*x.p)return; // 買不起
 if(q<0&&eq(i)<Math.abs(q)*x.p*0.5&&(p.pos[x.s]||0)<=0)return; // 放空保證金不足
 p.cash-=q*x.p;p.pos[x.s]=(p.pos[x.s]||0)+q;S.log.unshift({w:i,t:'你'+(q>0?' 買 ':' 賣 ')+Math.abs(q)+' '+x.s+' @'+x.p});S.log=S.log.slice(0,20);send()}
function sn(s){if(isHost)act(0,{s,sn:1});else conn.send({s,sn:1})}
function pw(s,v){if(isHost)act(0,{s,pw:v});else conn.send({s,pw:v})}
function trade(s,dir){const q=dir*+$('qty').value;if(isHost)act(0,{s,q});else conn.send({s,q})}
function send(){if(conn&&conn.open){const v=JSON.parse(JSON.stringify(S));v.pl[0]={cash:0,pos:{},up:0,dn:0};v.log=v.log.filter(l=>l.w!=0);conn.send(v)}render()}
function money(v){return '$'+Math.round(v).toLocaleString()}
function render(){if(!S)return;$('lobby').classList.add('hide');$('game').classList.remove('hide');
 for(let i=0;i<2;i++){const op=i!=me,e=op?S.snap[i]:eq(i),pl=e-START;$('e'+i).textContent=money(e);$('p'+i).innerHTML='<span class="'+(pl>=0?'up':'dn')+'">'+(pl>=0?'+':'')+money(pl)+'</span>'+(op?'<br><small>'+(S.over?'最終資產':'🔒 上回合結算・持股不公開')+'</small>':'');$('n'+i).textContent=(i?'挑戰者':'房主')+(i==me?'（你）':'')}
 $('rd').textContent=S.over?'比賽結束':S.brk>0?'📺 第 '+S.round+'/'+S.R+' 回合・新聞播報中… '+S.brk+' 秒後開盤':'第 '+S.round+'/'+S.R+' 回合・剩 '+(TICKS-S.tick)+' 秒';$('tb').style.width=(S.tick/TICKS*100)+'%';
 $('cash').textContent=money(S.pl[me].cash);$('pwi').textContent='🚀拉抬 '+S.pl[me].up+'・💣砸盤 '+S.pl[me].dn+'・🎯狙擊 '+(S.pl[me].sn||0);
 if(S.over){const a=S.snap[me],b=S.snap[1-me];$('news').innerHTML=a>b?'🏆 恭喜你獲勝！華爾街之狼就是你！':a<b?'😭 你輸了…下次記得停損！':'🤝 平手！英雄所見略同';}else $('news').textContent=S.news;{const tt=S.tv&&!S.over?S.tv.t+(S.brk>0?'#b':''):'';if(tt!==window._tv){window._tv=tt;const v=$('tv');v.innerHTML=tt?(S.brk>0?ANCHOR:'')+'<small class="live" style="color:#f85149">● LIVE</small> <small>盤前線索（可能是真的，也可能是騙人的）</small><div style="font-size:18px;margin-top:4px;overflow:hidden"><span class="tk">'+tt+'</span></div>':'';v.classList.remove('on');void v.offsetWidth;v.classList.add('on')}}
 $('tbl').innerHTML=S.st.map(x=>{const c=(x.p/x.o-1)*100,h=S.pl[me].pos[x.s]||0;const lp=(window._lp=window._lp||{})[x.s],fc=lp==null||lp==x.p?'':lp<x.p?'fu':'fd';window._lp[x.s]=x.p;return '<tr class="'+fc+'"><td><b>'+x.s+'</b><br><small>'+x.n+'</small></td><td class="'+(c>=0?'up':'dn')+'">'+x.p.toFixed(2)+'<br><small>'+(c>=0?'+':'')+c.toFixed(1)+'%</small></td><td><small>持有</small><br>'+h+'</td><td><button onclick="trade(\''+x.s+'\',1)">買</button><button class="r" onclick="trade(\''+x.s+'\',-1)">賣</button><br><button class="pw" onclick="pw(\''+x.s+'\',1)">🚀</button><button class="pw" onclick="pw(\''+x.s+'\',-1)">💣</button><button class="pw" onclick="sn(\''+x.s+'\')">🎯</button></td></tr>'}).join('');
 $('log').innerHTML=S.log.filter(l=>l.w<0||l.w==me).map(l=>l.t).join('<br>')}
</script>
<button id="mute" onclick="SFX.toggle()" style="position:fixed;top:8px;right:8px;z-index:99;padding:6px 10px;border-radius:20px">🔊</button>
<script>
const SFX=(()=>{let ac,mg,on=localStorage.sdMute!='1',mt=null,step=0;
function init(){if(ac)return;ac=new (window.AudioContext||window.webkitAudioContext)();mg=ac.createGain();mg.gain.value=on?1:0;mg.connect(ac.destination)}
function tone(f,d,t='square',v=.15,at=0,f2){if(!ac)return;const o=ac.createOscillator(),g=ac.createGain(),n=ac.currentTime+at;o.type=t;o.frequency.setValueAtTime(f,n);if(f2)o.frequency.exponentialRampToValueAtTime(f2,n+d);g.gain.setValueAtTime(v,n);g.gain.exponentialRampToValueAtTime(.001,n+d);o.connect(g);g.connect(mg);o.start(n);o.stop(n+d+.02)}
const bass=[110,110,131,98,110,147,131,98],mel=[440,0,523,0,659,587,523,0,392,0,440,523,0,494,440,0];
function music(){if(mt)return;mt=setInterval(()=>{if(!on)return;const b=bass[(step>>1)%8];if(step%2==0)tone(b,.25,'triangle',.12);if(step%4==2)tone(2000,.03,'square',.03);const m=mel[step%16];if(m&&step%32>=16)tone(m,.18,'sine',.05);step++},150)}
const S={click:()=>tone(800,.05,'square',.08),buy:()=>{tone(523,.08,'square',.1);tone(784,.12,'square',.1,.07)},sell:()=>{tone(659,.08,'square',.1);tone(392,.14,'square',.1,.07)},
up:()=>tone(300,.4,'sawtooth',.12,0,1200),dn:()=>tone(1000,.5,'sawtooth',.12,0,80),snipe:()=>{tone(1500,.05,'square',.1);tone(1500,.05,'square',.1,.08);tone(200,.3,'triangle',.2,.16,60)},
news:()=>{[880,1109,1319].forEach((f,i)=>tone(f,.15,'sine',.12,i*.12))},
toggle(){init();on=!on;localStorage.sdMute=on?'0':'1';mg.gain.value=on?1:0;document.getElementById('mute').textContent=on?'🔊':'🔇'}};
document.getElementById('mute').textContent=on?'🔊':'🔇';
document.addEventListener('pointerdown',e=>{init();ac.resume();music();if(e.target.closest('button')&&e.target.id!='mute')S.click()},true);
return S})();
(()=>{const w=(n,f)=>{const o=window[n];window[n]=function(...a){try{f(...a)}catch(e){}return o.apply(this,a)}};
w('trade',(s,d)=>d>0?SFX.buy():SFX.sell());w('pw',(s,v)=>v>0?SFX.up():SFX.dn());w('sn',()=>SFX.snipe());w('newsCard',()=>SFX.news());})();
</script></body></html>

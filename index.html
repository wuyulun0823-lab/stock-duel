<!DOCTYPE html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>美股對決 Stock Duel</title>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
.tw{max-height:60vh;overflow-y:auto;-webkit-overflow-scrolling:touch}
body{margin:0;font-family:system-ui,"Noto Sans TC",sans-serif;background:#0d1117;color:#e6edf3}
.wrap{max-width:720px;margin:auto;padding:12px}h1{text-align:center;font-size:22px}
button{background:#238636;color:#fff;border:0;border-radius:8px;padding:10px 14px;font-size:16px;margin:3px;cursor:pointer}
button.r{background:#da3633}button.g{background:#30363d}input{font-size:20px;padding:8px;width:120px;text-transform:uppercase;text-align:center;border-radius:8px;border:1px solid #444;background:#161b22;color:#fff}
.card{background:#161b22;border:1px solid #30363d;border-radius:10px;padding:10px;margin:8px 0}
.hud{display:flex;gap:8px}.hud .card{flex:1;text-align:center}.big{font-size:22px;font-weight:bold}
.up{color:#3fb950}.dn{color:#f85149}table{width:100%;border-collapse:collapse}td{padding:6px 3px;border-bottom:1px solid #222;font-size:15px}
.news{background:#3a2a00;border-color:#d29922;font-weight:bold}.bar{height:10px;background:#30363d;border-radius:5px;overflow:hidden}.bar div{height:100%;background:#1f6feb}
.code{font-size:36px;letter-spacing:6px;color:#d29922;text-align:center}.hide{display:none}.pw{background:#30363d;padding:4px 8px;font-size:14px}small{color:#8b949e}
</style></head><body><div class="wrap">
<h1>📈 美股對決 Stock Duel</h1>
<div id="lobby" class="card" style="text-align:center">
<p>股名為真實美股，價格與新聞皆為虛構，與實際行情無關</p>
<p>回合數 <select id="rounds"><option>3</option><option selected>5</option><option>8</option></select></p>
<button onclick="host()">建立房間</button>
<p>或輸入房間碼：<br><input id="code" maxlength="6"> <button onclick="join()">加入</button></p>
<div id="info"></div></div>
<div id="game" class="hide">
<div class="hud"><div class="card"><div id="n0">房主</div><div id="e0" class="big"></div><div id="p0"></div></div>
<div class="card"><div id="n1">挑戰者</div><div id="e1" class="big"></div><div id="p1"></div></div></div>
<div class="card"><span id="rd"></span><div class="bar"><div id="tb"></div></div></div>
<div id="tv" class="card" style="background:#000;border:3px solid #555;color:#fff"></div><div id="news" class="card news"></div>
<div class="card">股數 <select id="qty"><option>10</option><option selected>50</option><option>100</option><option>500</option></select> <small>你的現金：<b id="cash"></b></small><br><small>道具剩餘：<b id="pwi"></b>（雙方持股互不公開，對手資產每回合結束才更新）</small>
<div class="tw"><table id="tbl"></table></div><small>買＝做多/回補空單；賣＝賣出/放空（持股可為負）；🚀＝把該股拉抬一波、💣＝砸盤一波，🎯＝狙擊，該股瞬間隨機跳 ±8～15%；開局 🚀×2、💣×2、🎯×1，每 2 回合再補 🚀×2、💣×2、🎯×1</small></div>
<div id="log" class="card" style="font-size:13px;max-height:120px;overflow:auto"></div>
</div></div>
<script>
const PFX='stockduel-tw-',TICKS=30,START=100000;
const TK=[["AAPL","蘋果"],["TSLA","特斯拉"],["NVDA","輝達"],["AMZN","亞馬遜"],["META","Meta"],["GOOGL","谷歌"],["MSFT","微軟"],["NFLX","網飛"],["AMD","超微"],["INTC","英特爾"],["BA","波音"],["DIS","迪士尼"],["KO","可口可樂"],["JPM","摩根大通"],["XOM","埃克森美孚"],["COST","好市多"],["COIN","Coinbase"],["PLTR","Palantir"],["SMCI","美超微"],["GME","GameStop"]];
const NEWS=[["AAPL",.15,"🍎 AAPL 發表摺疊眼鏡手機，預購秒殺！"],["AAPL",-.12,"🍎 AAPL 執行長被拍到用對手手機"],["TSLA",.2,"🚗 TSLA 自駕車成功橫越沙漠"],["TSLA",-.18,"🚗 TSLA 召回 50 萬台：方向盤會唱歌"],["NVDA",.22,"💾 NVDA 拿下 AI 超大訂單"],["NVDA",-.15,"💾 NVDA 工廠停電，晶圓變鬆餅"],["XOM",.18,"🛢️ 產油國宣布減產"],["XOM",-.2,"🛢️ 人類發明喝水就能跑的引擎"],["AMZN",.1,"🛒 AMZN 黑色星期五營收創新高"],["MSFT",.16,"☁️ MSFT 宣布全球最大資料中心"],["MSFT",-.14,"☁️ MSFT 大當機 6 小時"],["GME",.4,"🐸 GME 被網紅喊上月球！"],["GME",-.35,"🐸 GME 網紅說他只是開玩笑"],["JPM",-.15,"🏦 JPM 被爆壞帳"],["*",.06,"🦅 聯準會意外降息，全面大漲！"],["*",-.07,"🐻 經濟衰退警報，全面重挫！"]];
let peer,conn,isHost=false,me=0,S=null;
const $=id=>document.getElementById(id);
function rc(){let c='',a='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';for(let i=0;i<6;i++)c+=a[Math.random()*a.length|0];return c}
function host(){isHost=true;me=0;const code=rc();peer=new Peer(PFX+code);
 peer.on('open',()=>{$('info').innerHTML='房間碼<div class="code">'+code+'</div>把房間碼傳給朋友，等待加入…'});
 peer.on('error',e=>$('info').textContent='錯誤：'+e.type);
 peer.on('connection',c=>{if(conn){c.close();return}conn=c;c.on('open',()=>start());c.on('data',d=>act(1,d));c.on('close',()=>alert('對手已離線'))})}
function join(){const code=$('code').value.trim().toUpperCase();if(code.length!=6)return alert('請輸入 6 碼');me=1;peer=new Peer();
 peer.on('open',()=>{$('info').textContent='連線中…';conn=peer.connect(PFX+code,{reliable:true});
  conn.on('open',()=>$('info').textContent='已連線，等待開始…');conn.on('data',d=>{S=d;render()});conn.on('close',()=>alert('房主已離線'))});
 peer.on('error',e=>$('info').textContent=e.type=='peer-unavailable'?'找不到房間':'錯誤：'+e.type)}
function start(){S={round:1,R:+$('rounds').value,tick:0,news:'',over:false,log:[],
 st:TK.map(([s,n])=>({s,n,p:+(20+Math.random()*280).toFixed(2),o:0,d:0})),snap:[START,START],pl:[{cash:START,pos:{},up:2,dn:2,sn:1},{cash:START,pos:{},up:2,dn:2,sn:1}]};
 S.st.forEach(x=>x.o=x.p);newsCard();send();setInterval(tick,1000)}
function tvClue(){const x=S.st[Math.random()*S.st.length|0],up=Math.random()<.5,real=Math.random()<.55;
const U=['財報大爆發！營收年增 87%','傳出被巨頭收購，溢價三成！','CEO 直播吃播宣布神祕新產品','分析師上調目標價至天際','獲得政府超大訂單'],D=['財報暴雷！獲利腰斬','傳 CFO 連夜搭機出境','遭監管機關突擊調查','工廠冒煙，產線停擺','大股東狂倒貨中'],SRC=['📺 華爾街晨間快報','📺 股市名嘴老王','📺 匿名內線爆料','📺 財經台獨家','📺 鄰居阿姨說'];
const L=up?U:D;S.tv={s:x.s,t:SRC[Math.random()*SRC.length|0]+'：'+x.s+' '+L[Math.random()*L.length|0]+(up?' 📈':' 📉'),real,up};
x.d+=((up==real)?1:-1)*(0.4+Math.random()*.4)}
function newsCard(){const n=NEWS[Math.random()*NEWS.length|0];S.news='第 '+S.round+' 回合快訊：'+n[2];S.st.forEach(x=>{if(n[0]=='*'||n[0]==x.s)x.d=n[1]/8;else x.d=0});tvClue()}
function tick(){if(S.over)return;S.tick++;
 S.st.forEach(x=>{let r=(Math.random()-.5)*.045+(x.d||0);if(x.d)x.d*=.8;if(Math.random()<.03)r+=(Math.random()-.5)*.25;x.p=Math.max(1,+(x.p*(1+r)).toFixed(2))});
 if(S.tick>=TICKS){S.snap=[eq(0),eq(1)];if(S.tv){S.log.unshift({w:-1,t:'🕵️ 盤前線索「'+S.tv.s+'」結果：'+(S.tv.real?'✅ 消息屬實':'❌ 假消息，騙到你了吧')})}S.st.forEach(x=>x.o=x.p);if(S.round>=S.R){S.over=true}else{S.round++;S.tick=0;newsCard();if((S.round-1)%2==0){S.pl.forEach(p=>{p.up+=2;p.dn+=2;p.sn=(p.sn||0)+1});S.log.unshift({w:-1,t:'🎁 補給：雙方各獲得 🚀×2、💣×2、🎯×1'});S.log=S.log.slice(0,20)}}}send()}
function eq(i){const p=S.pl[i];return p.cash+S.st.reduce((a,x)=>a+(p.pos[x.s]||0)*x.p,0)}
function act(i,d){if(S.over)return;const x=S.st.find(t=>t.s==d.s);if(!x)return;const q=d.q|0,p=S.pl[i];
 if(d.sn){if(!(p.sn>0))return;p.sn--;const m=(Math.random()<.5?-1:1)*(.08+Math.random()*.07);x.p=+(x.p*(1+m)).toFixed(2);S.log.unshift({w:-1,t:'🎯 狙擊！'+x.s+' 瞬間'+(m>0?'暴漲 +':'暴跌 ')+(m*100).toFixed(1)+'%'});S.log=S.log.slice(0,20);send();return}
 if(d.pw){const k=d.pw>0?'up':'dn';if(p[k]<=0)return;p[k]--;x.p=+(x.p*(1+d.pw*.06)).toFixed(2);x.d=d.pw*.03;S.log.unshift({w:-1,t:(d.pw>0?'🚀 神秘大戶拉抬 ':'💣 神秘空頭砸盤 ')+x.s+'！'});S.log=S.log.slice(0,20);send();return}
 if(q>0&&p.cash<q*x.p)return; // 買不起
 if(q<0&&eq(i)<Math.abs(q)*x.p*0.5&&(p.pos[x.s]||0)<=0)return; // 放空保證金不足
 p.cash-=q*x.p;p.pos[x.s]=(p.pos[x.s]||0)+q;S.log.unshift({w:i,t:'你'+(q>0?' 買 ':' 賣 ')+Math.abs(q)+' '+x.s+' @'+x.p});S.log=S.log.slice(0,20);send()}
function sn(s){if(isHost)act(0,{s,sn:1});else conn.send({s,sn:1})}
function pw(s,v){if(isHost)act(0,{s,pw:v});else conn.send({s,pw:v})}
function trade(s,dir){const q=dir*+$('qty').value;if(isHost)act(0,{s,q});else conn.send({s,q})}
function send(){if(conn&&conn.open){const v=JSON.parse(JSON.stringify(S));v.pl[0]={cash:0,pos:{},up:0,dn:0};v.log=v.log.filter(l=>l.w!=0);conn.send(v)}render()}
function money(v){return '$'+Math.round(v).toLocaleString()}
function render(){if(!S)return;$('lobby').classList.add('hide');$('game').classList.remove('hide');
 for(let i=0;i<2;i++){const op=i!=me,e=op?S.snap[i]:eq(i),pl=e-START;$('e'+i).textContent=money(e);$('p'+i).innerHTML='<span class="'+(pl>=0?'up':'dn')+'">'+(pl>=0?'+':'')+money(pl)+'</span>'+(op?'<br><small>'+(S.over?'最終資產':'🔒 上回合結算・持股不公開')+'</small>':'');$('n'+i).textContent=(i?'挑戰者':'房主')+(i==me?'（你）':'')}
 $('rd').textContent=S.over?'比賽結束':'第 '+S.round+'/'+S.R+' 回合・剩 '+(TICKS-S.tick)+' 秒';$('tb').style.width=(S.tick/TICKS*100)+'%';
 $('cash').textContent=money(S.pl[me].cash);$('pwi').textContent='🚀拉抬 '+S.pl[me].up+'・💣砸盤 '+S.pl[me].dn+'・🎯狙擊 '+(S.pl[me].sn||0);
 if(S.over){const a=S.snap[me],b=S.snap[1-me];$('news').innerHTML=a>b?'🏆 恭喜你獲勝！華爾街之狼就是你！':a<b?'😭 你輸了…下次記得停損！':'🤝 平手！英雄所見略同';}else $('news').textContent=S.news;$('tv').innerHTML=S.tv&&!S.over?'<small style="color:#f85149">● LIVE 盤前線索（可能是真的，也可能是騙人的）</small><div style="font-size:18px;margin-top:4px">'+S.tv.t+'</div>':'';
 $('tbl').innerHTML=S.st.map(x=>{const c=(x.p/x.o-1)*100,h=S.pl[me].pos[x.s]||0;return '<tr><td><b>'+x.s+'</b><br><small>'+x.n+'</small></td><td class="'+(c>=0?'up':'dn')+'">'+x.p.toFixed(2)+'<br><small>'+(c>=0?'+':'')+c.toFixed(1)+'%</small></td><td><small>持有</small><br>'+h+'</td><td><button onclick="trade(\''+x.s+'\',1)">買</button><button class="r" onclick="trade(\''+x.s+'\',-1)">賣</button><br><button class="pw" onclick="pw(\''+x.s+'\',1)">🚀</button><button class="pw" onclick="pw(\''+x.s+'\',-1)">💣</button><button class="pw" onclick="sn(\''+x.s+'\')">🎯</button></td></tr>'}).join('');
 $('log').innerHTML=S.log.filter(l=>l.w<0||l.w==me).map(l=>l.t).join('<br>')}
</script></body></html>
